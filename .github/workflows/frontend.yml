name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: showcase-fe:latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t "$IMAGE" \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            --build-arg NEXT_PUBLIC_WS_URL="${{ vars.NEXT_PUBLIC_WS_URL }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

      - name: Ship image to VM
        run: |
          docker save "$IMAGE" | gzip | ssh -i ~/.ssh/vm_key -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "gunzip | docker load"

      - name: Restart container
        run: |
          ssh -i ~/.ssh/vm_key -p "${{ secrets.VM_PORT }}" \
            -o StrictHostKeyChecking=accept-new \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "
              docker rm -f showcase-fe || true &&
              docker run -d --name showcase-fe --restart unless-stopped \
                -p 80:3000 --memory 512m $IMAGE &&
              docker image prune -f
            "